version: '3.8'

services:
  db:
    image: mongo:latest
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongodata:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=mongodb://db:27017/mini_erp?authSource=admin
      - JWT_SECRET=docker_local_secret_key
      - ADMIN_EMAIL=admin@minierp.com
      - ADMIN_PASSWORD=AdminPassword123
      - CORS_ORIGIN=http://localhost
    depends_on:
      - db
    # Command to run migrations/seed on startup, then start server
    command: sh -c "npx prisma db push && npm start"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  mongodata:
